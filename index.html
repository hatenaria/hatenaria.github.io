<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハテナリア">
<title>ハテナリア</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png?v=0.19.1">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png?v=0.19.1">
<link rel="manifest" href="manifest.json?v=0.19.1">
<style>
  :root{--ink:#3a3226;--paper:#fffaf0;--gold:#ffd66b;--gold-d:#d9a93a;--green:#9be3a8;--green-d:#5fb06d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#5ec3e8;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;touch-action:none}
  #world{display:block;position:fixed;inset:0}
  .hud{position:fixed;top:12px;left:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:62vw;pointer-events:none}
  .chip{background:rgba(255,250,240,.94);border-radius:16px;padding:10px 16px;font-size:19px;font-weight:bold;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  #coins{display:flex;gap:12px;align-items:center}
  .mat{font-size:16px;background:#eef6e8;border-radius:10px;padding:4px 10px}
  .tr{position:fixed;top:12px;right:12px;display:flex;gap:10px}
  .btn{min-height:64px;min-width:64px;padding:0 20px;border:none;border-radius:18px;background:var(--gold);color:var(--ink);font-size:21px;font-weight:bold;
    font-family:inherit;box-shadow:0 5px 0 var(--gold-d);cursor:pointer}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
  .btn:disabled{background:#e4ddd0;box-shadow:0 5px 0 #c6bdad;color:#9a907f;cursor:default}
  .btn:focus-visible,.btn.kfocus{outline:4px solid #3b82f6;outline-offset:3px}
  .isle:focus-visible{outline:none}
  .btn.sky{background:#bfe6ff;box-shadow:0 5px 0 #7fb6d9}
  .pad{position:fixed;right:20px;bottom:20px;display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:4px}
  .pad button{border:none;border-radius:20px;background:rgba(255,250,240,.88);font-size:30px;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15);touch-action:none}
  .pad button:active{background:var(--gold)}
  .pad [data-dir=up]{grid-area:1/2}.pad [data-dir=left]{grid-area:2/1}.pad [data-dir=right]{grid-area:2/3}.pad [data-dir=down]{grid-area:3/2}
  #check{position:fixed;left:20px;bottom:24px;min-height:84px;padding:0 28px;font-size:24px;background:var(--green);box-shadow:0 5px 0 var(--green-d)}
  #hint{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:rgba(58,50,38,.85);color:#fff;
    padding:10px 18px;border-radius:14px;font-size:19px;pointer-events:none;white-space:nowrap}
  #hint.show{opacity:1;transform:translate(-50%,0)}
  #layer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,50,80,.45);z-index:50}
  #layer.show{display:flex}
  .modal{background:var(--paper);border-radius:26px;padding:26px 30px;width:min(640px,94vw);max-height:92vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.25)}
  .modal h2{margin:0 0 14px;font-size:28px;text-align:center}
  /* 文章は分かち書きのすき間で折り返し、行は左そろえ（かたまりごと中央に置く） */
  .modal .body{font-size:22px;line-height:1.8;white-space:pre-line;text-align:left;width:fit-content;max-width:100%;margin:8px auto 22px;
    word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
  .modal h2,.notice h3,.notice p,.info .title,.info .sub,.iname{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
  .modal .small{font-size:17px;color:#5c5140;text-align:center;line-height:1.5} /* v0.18.0：小さく うすくて よみにくかった（14px #8a7e6c） */
  .row{display:flex;gap:14px;align-items:center}.row.end{justify-content:flex-end}.row.center{justify-content:center}.row.between{justify-content:space-between;margin-top:14px}
  .col{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
  .notices{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .notice{background:#fff;border:3px solid #eee3cf;border-radius:16px;padding:14px 18px}
  .notice.unread{border-color:#f2b544}
  .notice h3{margin:6px 0;font-size:22px}.notice p{margin:0;font-size:19px;line-height:1.7;white-space:pre-line}
  .ndate{font-size:15px;color:#8a7e6c;display:flex;gap:10px;align-items:center}
  .new{background:#e8483b;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px}
  /* 島めぐり */
  .modal.islands{width:min(980px,96vw);background:linear-gradient(#cdefff,#fffaf0 55%)}
  .sea{position:relative;height:300px;border-radius:22px;overflow:hidden;background:linear-gradient(#9fdcf5 0%,#5ec3e8 45%,#3fa9d6 100%);margin-bottom:16px}
  .sea.has-bg{background-size:cover;background-position:center 30%}
  .sea.has-bg .cloud{display:none}
  .track{position:absolute;left:0;top:0;height:100%;display:flex;gap:24px;align-items:center;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
  .isle{flex:0 0 180px;height:220px;border:none;background:none;position:relative;cursor:pointer;transform:scale(.72);transition:transform .45s;font-family:inherit;color:var(--ink)}
  .isle.sel{transform:scale(1.08)}
  .isle.sel .land{animation:bob 2.4s ease-in-out infinite}
  .land{position:absolute;left:10px;right:10px;top:40px;height:120px;border-radius:50%;background:#f1dca5;box-shadow:0 14px 0 rgba(20,90,130,.25)}
  .land::before{content:"";position:absolute;left:14px;right:14px;top:-10px;height:96px;border-radius:50%;background:var(--c)}
  .icon{position:absolute;left:0;right:0;top:4px;font-size:52px;text-align:center}
  .iname{position:absolute;left:0;right:0;bottom:8px;font-size:19px;font-weight:bold;background:rgba(255,255,255,.9);border-radius:12px;padding:4px 0}
  .isle.fog .land,.isle.fog .icon{filter:grayscale(.7) blur(1.5px);opacity:.6}
  .isle.fog .isle-img{filter:grayscale(.55) blur(.8px);opacity:.75}
  .isle.fog .soon{top:auto;bottom:50px}
  .isle-img{position:absolute;left:-6px;width:192px;bottom:46px;pointer-events:none;-webkit-user-drag:none}
  .isle.sel .isle-img{animation:bob 2.4s ease-in-out infinite}
  .soon{position:absolute;left:20px;right:20px;top:86px;background:rgba(255,255,255,.92);border-radius:10px;font-size:15px;padding:4px 0}
  .info{min-width:320px;text-align:center}.info .title{font-size:26px;font-weight:bold}.info .sub{font-size:18px;color:#6b5f4f;margin-top:4px}
  .btn.arrow{min-width:80px;font-size:28px}
  .btn.go{background:#f26b5b;color:#fff;box-shadow:0 5px 0 #b8473a;min-width:220px;font-size:24px}
  .cloud{position:absolute;width:140px;height:44px;background:rgba(255,255,255,.85);border-radius:30px;animation:drift 18s linear infinite}
  .cloud::after{content:"";position:absolute;left:30px;top:-22px;width:64px;height:54px;background:inherit;border-radius:50%}
  .c1{top:24px;left:-160px}.c2{top:70px;left:-160px;animation-delay:-9s;transform:scale(.7)}
  .modal.lift{animation:lift .9s ease-in forwards}
  .gacha .gx-stage{position:relative;height:200px;display:grid;place-items:center;overflow:hidden}
  .gacha .gx-egg{width:150px;height:150px;position:relative;z-index:2}
  .gacha .gx-egg.idle{animation:bob 2.4s ease-in-out infinite}
  .gacha .gx-egg.shake{animation:gxshake .3s ease-in-out infinite}
  .gacha .gx-egg.open{animation:gxpop .5s ease-out}
  .gacha .gx-fx{position:absolute;width:260px;height:260px;left:50%;top:50%;margin:-130px 0 0 -130px;z-index:1;pointer-events:none}
  .gacha .gx-fx.rays{animation:gxspin 6s linear infinite}.gacha .gx-fx.sparkle{animation:gxgrow .8s ease-out both}
  .gacha .gx-prize{text-align:center;border-radius:14px;padding:8px;margin:4px 0;background:#fff7e0}
  .gacha .gx-prize.gx-rare{background:#ece6ff}.gacha .gx-prize.gx-super{background:linear-gradient(90deg,#fff1b8,#ffd6f0,#d6f0ff);font-weight:bold}
  .gacha .gx-pname{font-size:20px;font-weight:bold;white-space:pre-line}
  .gacha .gx-rank{border-radius:12px;padding:8px 12px;margin:6px 0;background:#fff7e0;text-align:center}.gacha .gx-rank b{font-size:20px}.gacha .gx-items span{display:inline-block;white-space:nowrap;margin:0 8px}.gacha .gx-rank.gx-rare{background:#ece6ff}.gacha .gx-rank.gx-super{background:#fff1b8}
  @keyframes gxshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
  @keyframes gxpop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes gxspin{to{transform:rotate(360deg)}}
  @keyframes gxgrow{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.gacha .gx-egg,.gacha .gx-fx{animation:none!important}}
  .hud #who.tap{pointer-events:auto;cursor:pointer}
  .hud #who.tap::after{content:' ▾';font-size:.8em;opacity:.7}
  .whoami{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.78);color:#4a4032;font-size:14px;padding:3px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
  body.in-room .whoami{display:none}
  .note{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60;background:#fffaf0;border:3px solid #ffd66b;border-radius:16px;padding:10px 18px;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:90vw;text-align:center;transition:opacity .5s}.note.out{opacity:0}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes drift{to{left:110%}}
  @keyframes lift{to{transform:translateY(-120vh)}}
  body:not(.ready) .pad,body:not(.ready) #check,body:not(.ready) .tr{visibility:hidden}
  /* スマートフォンなど幅のせまい画面（たて向き） */
  @media (max-width:700px){
    .chip{font-size:15px;padding:8px 12px;border-radius:12px}
    .hud{gap:6px;max-width:calc(100vw - 190px)}
    .tr{gap:6px}
    .btn{min-height:52px;min-width:52px;padding:0 14px;font-size:17px;border-radius:14px}
    #check{min-height:64px;padding:0 20px;font-size:19px;left:12px;bottom:16px}
    .pad{right:12px;bottom:12px;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(3,62px)}
    .pad button{font-size:24px;border-radius:16px}
    .modal{padding:20px 18px;border-radius:22px}
    .modal h2{font-size:23px}
    .modal .body{font-size:19px}
    .notice h3{font-size:19px}.notice p{font-size:17px}
    .info{min-width:0;flex:1}.info .title{font-size:20px}.info .sub{font-size:15px}
    .btn.arrow{min-width:56px}.btn.go{min-width:0;flex:1;font-size:19px}
    .row.between{gap:10px}
    .sea{height:240px}.isle{flex-basis:150px;height:190px}.isle-img{width:160px;left:-5px}
  }
  @media (max-height:620px){.pad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px)}.sea{height:220px}.isle{height:180px}}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 14px}.grades .btn{min-height:68px;font-size:24px}.grades .btn.on{background:#9be3a8;box-shadow:0 4px 0 #5fb06d}
  /* 建てる・こうかんじょ */
  .modal.build{max-width:720px}
  .body.small{font-size:18px;color:#4a4032;margin:4px auto 10px;text-align:center}
  .blist{display:flex;flex-direction:column;gap:10px;max-height:min(52vh,460px);overflow:auto;padding:4px}
  .brow{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 2px 0 #e6dccb}
  .brow > img,.brow > .nopic{width:84px;height:72px;object-fit:contain}
  .brow .nopic{display:flex;align-items:center;justify-content:center;font-size:36px;color:#b9ad96;background:#f4efe4;border-radius:12px}
  .brow.no > img{filter:grayscale(.5) opacity(.7)}
  .bname{font-size:20px;font-weight:bold}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chip{background:#f3efe4;border-radius:999px;padding:2px 10px;font-size:16px}
  .chip.short{background:#fde2dc;color:#b23a2b}
  .bnote{font-size:16px;color:#8a5a10;margin-top:2px}
  .btn.go{background:#9be3a8;box-shadow:0 4px 0 #5fb06d}
  .btn[disabled]{opacity:.45;cursor:default}
  .xrow{margin:6px 0 10px}.xlabel{font-weight:bold;margin-bottom:6px}
  .xmats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .xmat{min-height:60px;font-size:20px;padding:0 4px;background:#fff;box-shadow:0 4px 0 #d8cfbd}
  .xmat.on{background:#ffd66b;box-shadow:0 4px 0 #d9a93a}
  .xsum{min-height:1.5em}
  .micon{width:1.35em;height:1.35em;vertical-align:-.3em;object-fit:contain}
  .xmat .micon{width:1.6em;height:1.6em}
  /* しまづくり */
  .editbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:14px;background:rgba(255,250,240,.96);
    border-radius:20px;padding:8px 10px 8px 20px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-size:20px;font-weight:bold;z-index:5;max-width:calc(100vw - 24px)}
  .editbar .cost{font-weight:normal;font-size:18px;white-space:nowrap}
  body.editing .editbar{display:flex}
  .editbar .btn{white-space:nowrap;flex:none}
  body.editing .tr,body.editing .hud{visibility:hidden}
  #btn-room,#btn-out{display:none}
  body.in-room #btn-room,body.in-room #btn-out{display:inline-flex}
  body.in-room #btn-build,body.in-room #btn-balloon,body.in-room #btn-zoom{display:none}
  body.zoomed #btn-zoom{background:#9be3a8}
  .menu2{display:flex;flex-direction:column;gap:12px;margin:8px 0 16px}
  .btn.big{min-height:76px;font-size:24px}
  .chips.big{justify-content:center;margin:6px 0 10px}.chips.big .chip{font-size:22px;padding:4px 14px}
  /* ミッション */
  .ms-list{margin:8px 0}
  .ms-row{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;margin:0 0 8px}
  .ms-row.ok{background:#fff6dc}.ms-row.got{opacity:.7}
  .ms-name{font-weight:bold}.ms-tag{font-size:14px;color:#7a6a50}.ms-reward{grid-column:1/-1;font-size:13px;color:#7a6a50;margin-top:-4px}
  .ms-bar{height:12px;border-radius:6px;background:#eadfca;overflow:hidden}.ms-bar span{display:block;height:100%;background:#f1c84b}
  /* がっこう・しゅくだい */
  .school h3.sec{margin:12px 0 6px;font-size:19px}
  .hw-list{max-height:46vh;overflow:auto}
  .hw-card{background:#fff;border-radius:16px;padding:10px 16px;margin:0 0 10px;box-shadow:inset 0 -5px 0 #e8e0cc}
  .hw-card.done{background:#f1fbf4;box-shadow:inset 0 -5px 0 #cdebd6}
  .hw-card h3{margin:2px 0;font-size:19px}
  .hw-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hw-sub{font-size:14px;font-weight:bold;color:#7a6a50}
  .hw-head .todo-due{min-height:0;padding:3px 12px;border-radius:12px;font-size:14px;font-weight:bold}
  /* きせかえや */
  .kisekae .tabs{margin:6px 0}
  .kisekae .wlist{max-height:30vh;overflow-y:auto;margin:4px 0;padding-bottom:6px;scrollbar-gutter:stable}
  [data-scroll]{scrollbar-gutter:stable;padding-bottom:6px} /* おしたときに ボタンが 3px さがっても スクロールバーが でたり きえたり しない（ならびが ずれて おせなくなる）2026-11-19 */
  .kisekae .wtag{display:block;font-size:15px;color:#5c5140;margin-top:2px}
  /* クラスイベント */
  .ev-card{background:linear-gradient(#fff,#fff5e2);border-radius:16px;padding:10px 16px;margin:4px 0 12px;box-shadow:inset 0 -5px 0 #f1dcb4}
  .ev-card h3{margin:0 0 4px;font-size:20px}
  .ev-card.has-tree{position:relative;padding-right:120px;min-height:130px}
  .ev-tree{position:absolute;right:12px;bottom:8px;width:96px}
  .ev-bar{height:18px;border-radius:9px;background:#eadfca;overflow:hidden;margin:6px 0}
  .ev-fill{height:100%;background:linear-gradient(90deg,#7cc6a4,#9bd8a0);border-radius:9px}
  .ev-num{margin:2px 0;font-weight:bold;font-size:18px}
  /* かざりだな・まなびの きろく */
  .shelf-box,.desk-box{max-height:56vh;overflow:auto;margin-bottom:10px}
  .shelf-row{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
  .shelf-item{margin:0;width:96px;text-align:center;background:linear-gradient(#fff,#f6ead2);border-radius:14px;padding:8px 4px 6px;box-shadow:inset 0 -6px 0 #e6d2a8}
  .shelf-item img,.shelf-ph{display:block;width:64px;height:64px;margin:0 auto;object-fit:contain;font-size:48px;line-height:64px}
  .shelf-item.trophy{background:linear-gradient(#fff8e1,#ffe9a8)}
  .shelf-item figcaption{font-size:13px;line-height:1.3;margin-top:4px}
  .desk-box{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .desk-card{background:#fff;border-radius:16px;padding:10px 14px}
  .desk-card h3{margin:0 0 4px;font-size:20px}.desk-stars{margin:0;font-size:18px;font-weight:bold}
  .desk-units{margin:6px 0 0;padding-left:0;list-style:none;font-size:16px}
  /* やることボード */
  .todo-list{display:flex;flex-direction:column;gap:8px;max-height:38vh;overflow:auto;margin:6px 0 10px}
  .todo-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px}
  .todo-row.done .todo-text{text-decoration:line-through;color:#8a8170}
  .todo-text{flex:1;font-size:20px;word-break:keep-all;overflow-wrap:anywhere}
  .todo-check,.todo-del{min-width:56px;min-height:52px;font-size:24px;padding:0}
  .todo-input{width:100%;box-sizing:border-box;font-size:22px;padding:12px 14px;border-radius:14px;border:2px solid #e3d6bd;margin:8px 0 12px}
  .todo-due{min-height:44px;font-size:15px;padding:0 10px;white-space:nowrap;box-shadow:none}
  .todo-due.due-today{background:#ffd9d2}.todo-due.due-soon{background:#ffe7c4}.todo-due.due-later{background:#e3f0ff}.todo-due.due-any{background:#eee8dc}
  .todo-due.due-late{background:#f2c7c7}
  .todo-ask{margin:8px 0 10px;font-size:22px;text-align:center}
  .todo-date{max-width:260px}
  .todo-garden{margin:4px 0 8px;line-height:1.8}
  /* じかんわり */
  .ttbox{max-height:62vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
  .ttimg{max-width:100%;height:auto;border-radius:10px;background:#fff}
  .tt .btn.go{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;min-height:60px;padding:0 22px}
  .notice p a{color:#2563eb;font-weight:bold;margin:0 4px}
  /* しゅじんこう */
  .hero-ed{max-height:94vh;overflow:auto}.hero-pv{display:block;margin:0 auto 6px;width:min(330px,60vw);height:auto;background:linear-gradient(#e9f6ff,#fff8ea);border-radius:18px}
  .hopts{display:flex;flex-wrap:wrap;gap:8px}.hopts .btn{min-height:56px;font-size:18px;padding:0 14px}
  .hero-ed .hopts .btn{min-height:48px}.hero-ed .xrow{margin:4px 0 8px}
  .hero-ed>.row.end{position:sticky;bottom:-26px;margin:0 -30px -26px;padding:10px 30px 16px;background:linear-gradient(rgba(255,251,240,0),var(--paper) 30%)}
  /* クラスに はいる */
  .numdisp{font-size:40px;font-weight:bold;text-align:center;background:#fff;border-radius:16px;padding:6px;margin:4px auto 10px;width:160px;letter-spacing:.1em}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
  .numpad .btn{min-height:60px;font-size:26px;background:#fff;box-shadow:0 4px 0 #d8cfbd}
  .numpad [data-num=del]{font-size:18px}
