<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>りかの しま あんないじょ｜ハテナリア</title>
<style>
  :root{--ink:#3a3226;--gold:#ffd66b;--gold-d:#d9a93a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;color:var(--ink);
    background:radial-gradient(circle at 50% 30%,#e6f6ff 0,#bfe6fb 60%,#8fd0f2 100%);display:grid;place-items:center;padding:20px}
  .card{background:#fffaf0;border-radius:24px;box-shadow:0 10px 30px rgba(0,60,100,.18);padding:24px 26px;width:min(560px,100%);text-align:center}
  h1{margin:0 0 6px;font-size:28px}
  .isle{width:220px;max-width:60%;margin:0 auto 4px;display:block}
  p{font-size:18px;line-height:1.6;margin:8px 0}
  .small{font-size:15px;color:#6b5f4c}
  input{width:100%;font-size:28px;letter-spacing:.08em;text-align:center;padding:14px;border:3px solid #cbbd9f;border-radius:16px;margin:10px 0;text-transform:uppercase;font-family:ui-monospace,Menlo,monospace}
  input:focus{outline:5px solid #3b82f6;outline-offset:2px}
  .btn{min-height:64px;padding:0 26px;border:none;border-radius:18px;background:var(--gold);color:var(--ink);font-size:22px;font-weight:bold;
    box-shadow:0 5px 0 var(--gold-d);cursor:pointer;touch-action:manipulation;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin:6px}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d)}
  .btn:disabled{background:#e4ddd0;box-shadow:0 5px 0 #c6bdad;color:#9a907f}
  .btn.sky{background:#bfe3ff;box-shadow:0 5px 0 #7fb6e0}
  .res{border-radius:16px;padding:12px;margin:10px 0;font-size:19px;white-space:pre-line;display:none}
  .res.ok{display:block;background:#e5f4e4}.res.ng{display:block;background:#fbebeb}
</style>
</head>
<body>
<main class="card">
  <img class="isle" src="../assets/home/isle_rika.webp" alt="">
  <h1>🔬 りかの しま あんないじょ</h1>
  <p>りかの しまは いま じゅんびちゅう。<br>「りかクエスト」で もらった <b>ハテナリアコード</b>を ここに はってね。</p>
  <input id="code" placeholder="HQ-XXXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="20" aria-label="ハテナリアコード">
  <div>
    <button class="btn" id="go">🎁 うけとる</button>
    <a class="btn sky" id="home" href="../index.html">🏝 ホームに かえる</a>
  </div>
  <div class="res" id="res" role="status"></div>
  <p class="small">コードは もらった日から 3日 つかえるよ。いちど つかった コードは もう つかえないよ。</p>
</main>
<script type="module">
const V = '0.16.2';
const $ = (id) => document.getElementById(id);
let island = null;
try {
  const api = await import(`../common/island-api.js?v=${V}`);
  island = await api.connect({ appId: 'rika-annai', subject: 'rika' });
  if (island) $('home').href = island.homeUrl;
} catch (e) { $('res').className = 'res ng'; $('res').textContent = 'よみこみに しっぱいしたよ。ホームから もういちど きてね。'; }
const WHY = {
  bad: 'コードが ちがうみたい。もういちど よく みて はってね。',
  old: 'この コードは 3日 すぎて つかえなく なったよ。',
  used: 'この コードは もう つかわれているよ。',
  off: 'いまは コードが つかえないよ。（せんせいの せってい）',
};
async function go() {
  if (!island) return;
  const v = $('code').value.trim(); if (!v) { $('code').focus(); return; }
  $('go').disabled = true;
  try {
    const r = await island.redeemCode(v);
    if (r.ok) {
      $('res').className = 'res ok';
      $('res').textContent = `🎉 りかクエスト、がんばったね！（レベル ${r.level}）\n🪙 コイン ＋${r.gain?.coin || 0}　💧 りかの そざい ＋${r.gain?.material || 0}${r.gain?.bonus ? '（きょう はじめての りかで ＋2こ！）' : ''}`;
      $('code').value = '';
    } else { $('res').className = 'res ng'; $('res').textContent = WHY[r.why] || 'うまく いかなかったよ。'; }
  } catch { $('res').className = 'res ng'; $('res').textContent = 'うまく いかなかったよ。もういちど ためしてね。'; }
  $('go').disabled = false;
}
$('go').addEventListener('click', go);
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('code').focus();
</script>
</body>
</html>
